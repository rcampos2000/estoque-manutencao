{% extends 'base.html' %}
{% block title %}{{ 'Editar' if peca else 'Nova' }} Peça{% endblock %}
{% block page_title %}{{ '✏️ Editar' if peca else '＋ Nova' }} Peça{% endblock %}
{% block content %}
<div style="max-width:700px">
<form method="POST">
  <div style="display:flex;gap:12px">
    <div class="form-group" style="flex:1"><label>Código *</label><input class="form-control" name="codigo" value="{{ peca.codigo if peca else '' }}" required></div>
    <div class="form-group" style="flex:1"><label>Código de Barras</label><input class="form-control" name="codigo_barras" value="{{ peca.codigo_barras if peca else '' }}"></div>
  </div>
  <div class="form-group"><label>Nome *</label><input class="form-control" name="nome" value="{{ peca.nome if peca else '' }}" required></div>
  <div class="form-group"><label>Descrição</label><textarea class="form-control" name="descricao" rows="2">{{ peca.descricao if peca else '' }}</textarea></div>
  <div style="display:flex;gap:12px;flex-wrap:wrap">
    <div class="form-group" style="flex:1;min-width:160px"><label>Categoria</label>
      <select class="form-control" name="categoria_id">
        <option value="">— Selecione —</option>
        {% for c in categorias %}<option value="{{ c.id }}" {{ 'selected' if peca and peca.categoria_id==c.id }}>{{ c.nome }}</option>{% endfor %}
      </select></div>
    <div class="form-group" style="flex:1;min-width:160px"><label>Fornecedor</label>
      <select class="form-control" name="fornecedor_id">
        <option value="">— Selecione —</option>
        {% for f in fornecedores %}<option value="{{ f.id }}" {{ 'selected' if peca and peca.fornecedor_id==f.id }}>{{ f.nome }}</option>{% endfor %}
      </select></div>
    <div class="form-group" style="flex:1;min-width:160px"><label>Localização</label>
      <select class="form-control" name="localizacao_id">
        <option value="">— Selecione —</option>
        {% for l in localizacoes %}<option value="{{ l.id }}" {{ 'selected' if peca and peca.localizacao_id==l.id }}>{{ l.nome }}</option>{% endfor %}
      </select></div>
  </div>
  <div style="display:flex;gap:12px;flex-wrap:wrap">
    {% if not peca %}
    <div class="form-group" style="flex:1;min-width:100px"><label>Quantidade Inicial</label><input class="form-control" name="quantidade" type="number" step="0.1" value="0"></div>
    {% endif %}
    <div class="form-group" style="flex:1;min-width:100px"><label>Estoque Mínimo</label><input class="form-control" name="estoque_minimo" type="number" step="0.1" value="{{ peca.estoque_minimo if peca else 1 }}"></div>
    <div class="form-group" style="flex:1;min-width:100px"><label>Estoque Máximo</label><input class="form-control" name="estoque_maximo" type="number" step="0.1" value="{{ peca.estoque_maximo if peca else 100 }}"></div>
    <div class="form-group" style="flex:1;min-width:80px"><label>Unidade</label><input class="form-control" name="unidade" value="{{ peca.unidade if peca else 'UN' }}"></div>
  </div>
  <div style="display:flex;gap:12px">
    <div class="form-group" style="flex:1"><label>Custo Unitário (R$)</label><input class="form-control" name="custo_unitario" type="number" step="0.01" value="{{ peca.custo_unitario if peca else 0 }}"></div>
    <div class="form-group" style="flex:1"><label>Preço de Venda (R$)</label><input class="form-control" name="preco_venda" type="number" step="0.01" value="{{ peca.preco_venda if peca else 0 }}"></div>
  </div>
  <div style="display:flex;gap:10px;margin-top:8px">
    <button class="btn btn-success" type="submit">💾 Salvar</button>
    <a href="/pecas" class="btn" style="background:#37474f;color:#fff">✖ Cancelar</a>
  </div>
</form>
</div>
{% endblock %}
