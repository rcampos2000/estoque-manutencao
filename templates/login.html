<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login — Controle de Estoque</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#1a1a2e;color:#e0e0e0;font-family:'Segoe UI',Arial,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center}
.card{background:#16213e;border-radius:16px;padding:40px 36px;width:380px;box-shadow:0 8px 40px rgba(0,0,0,.5)}
.icon{text-align:center;font-size:54px;margin-bottom:8px}
h1{text-align:center;font-size:20px;margin-bottom:4px}
.sub{text-align:center;color:#90a4ae;font-size:13px;margin-bottom:28px}
label{display:block;font-size:12px;color:#90a4ae;margin-bottom:5px}
input{width:100%;padding:11px 14px;background:#0f3460;border:1px solid #1e3a5f;border-radius:9px;color:#e0e0e0;font-size:15px;margin-bottom:16px}
input:focus{outline:none;border-color:#1565c0}
button{width:100%;padding:13px;background:#1565c0;color:#fff;border:none;border-radius:9px;font-size:15px;font-weight:700;cursor:pointer;margin-top:4px}
button:hover{background:#0d47a1}
.error{background:#3e1515;border:1px solid #c62828;color:#ef9a9a;padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:14px}
.hint{text-align:center;color:#78909c;font-size:11px;margin-top:18px}
</style>
</head>
<body>
<div class="card">
  <div class="icon">⚙️</div>
  <h1>Controle de Estoque</h1>
  <p class="sub">Peças de Reposição — Manutenção Industrial</p>
  {% if error %}<div class="error">⚠️ {{ error }}</div>{% endif %}
  <form method="POST">
    <label>Usuário</label>
    <input name="login" placeholder="login" autofocus autocomplete="username">
    <label>Senha</label>
    <input name="senha" type="password" placeholder="senha" autocomplete="current-password">
    <button type="submit">Entrar →</button>
  </form>
  <p class="hint">Admin padrão: admin / admin123</p>
</div>
</body>
</html>
